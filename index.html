<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>MDT – Politie Nieuwdam</title>

<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:#0e4f8a;color:white;height:100vh;overflow:hidden}

/* TOPBAR */
.topbar{
    height:60px;
    background:#0b3f73;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    font-weight:bold;
    position:relative;
}
.menu{position:absolute;right:20px;cursor:pointer;font-size:28px}

/* LAYOUT */
.container{
    display:grid;
    grid-template-columns:360px 1fr;
    height:calc(100vh - 60px);
    gap:12px;
    padding:12px;
}

/* PANELS */
.panel{
    background:#0b3f73;
    border-radius:20px;
    padding:16px;
    overflow-y:auto;
}
.panel h2{text-align:center;margin-bottom:12px}

/* EENHEDEN */
.unit-card{
    display:flex;
    align-items:center;
    padding:12px;
    border-radius:14px;
    margin-bottom:10px;
    background:#0b4a78;
    box-shadow:0 4px 10px rgba(0,0,0,.3);
    cursor:grab;
}
.unit-color{
    width:6px;
    height:100%;
    border-radius:4px;
    margin-right:10px;
}
.unit-info{flex:1}
.unit-top{font-weight:bold;font-size:15px}
.unit-bottom{font-size:13px;color:#cce6ff}

.status-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    margin-right:10px;
}
.Beschikbaar{background:#2ecc71}
.Bezet{background:#f39c12}
.Pauze{background:#95a5a6}

.unit-actions select{
    background:#0e5ea3;
    color:white;
    border:none;
    border-radius:6px;
    padding:4px;
    margin-right:6px;
}
.delete-unit{cursor:pointer;font-size:18px}

/* MELDINGEN */
.melding{
    border-radius:14px;
    padding:12px;
    margin-bottom:10px;
    cursor:pointer;
}
.prio1{background:#e74c3c}
.prio2{background:#f39c12}
.prio3{background:#2ecc71}

.melding small{opacity:.9}

/* MODALS */
.modal{
    position:fixed;
    top:0;left:0;
    width:100%;
    height:100%;
    background:#0b3f73;
    z-index:999;
    display:none;
    padding:20px;
}
.modal h2{text-align:center}
.close{position:absolute;top:20px;right:20px;font-size:28px;cursor:pointer}

.modal label{margin-top:10px;display:block}
.modal input,.modal select,.modal textarea{
    width:100%;
    padding:8px;
    border:none;
    border-radius:8px;
    margin-top:4px;
}
.modal button{
    width:100%;
    margin-top:14px;
    padding:10px;
    border:none;
    border-radius:10px;
    background:#1abc9c;
    font-size:16px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
    POLITIE NIEUWDAM MDT
    <div class="menu" onclick="toggleMenu()">☰</div>
</div>

<div class="container">

    <!-- EENHEDEN -->
    <div class="panel">
        <h2>Actieve Eenheden</h2>
        <button onclick="openUnitModal()">+ Eenheid</button>
        <div id="units"></div>
    </div>

    <!-- MELDINGEN -->
    <div class="panel">
        <h2>Actieve Meldingen</h2>
        <button onclick="openMeldingModal()">+ Melding</button>
        <div id="meldingen"></div>
    </div>

</div>

<!-- EENHEID MODAL -->
<div class="modal" id="unitModal">
    <div class="close" onclick="closeUnitModal()">✖</div>
    <h2>Eenheid aanmaken</h2>

    <label>Roepnummer</label>
    <input id="uRoep">

    <label>Naam</label>
    <input id="uNaam">

    <label>Rang</label>
    <select id="uRang"></select>

    <label>Functie</label>
    <select id="uFunctie"></select>

    <button onclick="saveUnit()">Opslaan</button>
</div>

<!-- MELDING MODAL -->
<div class="modal" id="meldingModal">
    <div class="close" onclick="closeMeldingModal()">✖</div>
    <h2>Melding aanmaken</h2>

    <label>Prioriteit</label>
    <select id="mPrio">
        <option value="1">Prio 1</option>
        <option value="2">Prio 2</option>
        <option value="3">Prio 3</option>
    </select>

    <label>Locatie</label>
    <input id="mLoc">

    <label>Omschrijving</label>
    <input id="mOms">

    <label>Portokanaal</label>
    <input id="mPorto">

    <label>Notities</label>
    <textarea id="mNote"></textarea>

    <button onclick="saveMelding()">Opslaan</button>
</div>

<script>
/* CONFIG – makkelijk uitbreidbaar */
const RANGEN=["Surveillant","Agent","Hoofdagent","Brigadier","Inspecteur"];
const FUNCTIES={
    "Surveillance":"#3498db",
    "Verkeer":"#9b59b6",
    "OVD":"#e67e22",
    "Recherche":"#16a085"
};

/* STORAGE */
let units=JSON.parse(localStorage.getItem("units"))||[];
let meldingen=JSON.parse(localStorage.getItem("meldingen"))||[];

/* INIT */
const uRang=document.getElementById("uRang");
const uFunctie=document.getElementById("uFunctie");
RANGEN.forEach(r=>uRang.innerHTML+=`<option>${r}</option>`);
Object.keys(FUNCTIES).forEach(f=>uFunctie.innerHTML+=`<option>${f}</option>`);

function saveData(){
    localStorage.setItem("units",JSON.stringify(units));
    localStorage.setItem("meldingen",JSON.stringify(meldingen));
}

/* EENHEDEN */
function renderUnits(){
    const el=document.getElementById("units");
    el.innerHTML="";
    units.forEach((u,i)=>{
        el.innerHTML+=`
        <div class="unit-card" draggable="true" ondragstart="dragUnit(${i})">
            <div class="unit-color" style="background:${FUNCTIES[u.functie]}"></div>
            <div class="status-dot ${u.status}"></div>
            <div class="unit-info">
                <div class="unit-top">${u.roep} – ${u.rang}</div>
                <div class="unit-bottom">${u.naam} · ${u.functie}</div>
            </div>
            <div class="unit-actions">
                <select onchange="setStatus(${i},this.value)">
                    <option ${u.status=="Beschikbaar"?"selected":""}>Beschikbaar</option>
                    <option ${u.status=="Bezet"?"selected":""}>Bezet</option>
                    <option ${u.status=="Pauze"?"selected":""}>Pauze</option>
                </select>
                <span class="delete-unit" onclick="delUnit(${i})">✖</span>
            </div>
        </div>`;
    });
    saveData();
}

function saveUnit(){
    units.push({
        roep:uRoep.value,
        naam:uNaam.value,
        rang:uRang.value,
        functie:uFunctie.value,
        status:"Beschikbaar"
    });
    closeUnitModal();
    renderUnits();
}

function setStatus(i,s){units[i].status=s;renderUnits();}
function delUnit(i){units.splice(i,1);renderUnits();}

/* MELDINGEN */
function renderMeldingen(){
    const el=document.getElementById("meldingen");
    el.innerHTML="";
    meldingen.forEach((m,i)=>{
        el.innerHTML+=`
        <div class="melding prio${m.prio}" ondragover="event.preventDefault()" ondrop="dropUnit(${i})" onclick="openEdit(${i})">
            <strong>Prio ${m.prio}</strong><br>
            ${m.loc}<br>
            <small>${m.omschrijving}</small><br>
            <small>Porto: ${m.porto||"-"}</small><br>
            <small>Eenheden: ${(m.units||[]).join(", ")}</small>
        </div>`;
    });
    saveData();
}

function saveMelding(){
    meldingen.push({
        prio:mPrio.value,
        loc:mLoc.value,
        omschrijving:mOms.value,
        porto:mPorto.value,
        note:mNote.value,
        units:[]
    });
    closeMeldingModal();
    renderMeldingen();
}

function dropUnit(mi){
    const ui=dragged;
    if(!meldingen[mi].units.includes(units[ui].roep)){
        meldingen[mi].units.push(units[ui].roep);
        units[ui].status="Bezet";
    }
    renderUnits();renderMeldingen();
}

/* DRAG */
let dragged=null;
function dragUnit(i){dragged=i}

/* MODALS */
function openUnitModal(){unitModal.style.display="block"}
function closeUnitModal(){unitModal.style.display="none"}
function openMeldingModal(){meldingModal.style.display="block"}
function closeMeldingModal(){meldingModal.style.display="none"}

/* START */
renderUnits();
renderMeldingen();
</script>

</body>
</html>
